name: Build ARM64 libhdfs3.so (glibc 2.28)

on:
  push:
    branches: [ master, source_from_vs ]
  pull_request:
    branches: [ master, source_from_vs ]
  workflow_dispatch:

jobs:
  build-arm64-glibc228:
    name: Build ARM64 (glibc 2.28 / AlmaLinux 8)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build in AlmaLinux 8 container (glibc 2.28)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace almalinux:8 bash -c "
            set -e
            echo '=== System glibc version ==='
            ldd --version | head -n 1

            echo '=== Installing dependencies ==='
            dnf install -y epel-release 'dnf-command(config-manager)'
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb || true
            dnf install -y gcc gcc-c++ cmake make protobuf-devel protobuf-compiler libxml2-devel krb5-devel libuuid-devel libgsasl-devel openssl-devel boost-devel

            echo '=== Configuring CMake ==='
            rm -rf build-glibc228
            mkdir -p build-glibc228
            cd build-glibc228
            cmake .. -DCMAKE_BUILD_TYPE=Release

            echo '=== Building libhdfs3.so ==='
            make -j\$(nproc) libhdfs3-shared

            echo '=== Dependencies (ldd in container) ==='
            ldd src/libhdfs3.so
          "

      - name: Verify build artifact and GLIBC version
        run: |
          ls -la build-glibc228/src/libhdfs3.so*
          file build-glibc228/src/libhdfs3.so
          echo "=== Referenced GLIBC versions in libhdfs3.so ==="
          objdump -T build-glibc228/src/libhdfs3.so | grep -o 'GLIBC_[0-9.]*' | sort -uV
          echo "=== Direct DT_NEEDED dependencies (readelf) ==="
          readelf -d build-glibc228/src/libhdfs3.so | grep NEEDED

      - name: Upload ARM64 glibc-2.28 libhdfs3.so
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs3-linux-arm64-glibc2.28
          path: build-glibc228/src/libhdfs3.so*
          if-no-files-found: error
