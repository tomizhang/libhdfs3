name: Build ARM64 libhdfs3.so (glibc 2.28)

on:
  push:
    branches: [ master, source_from_vs ]
  pull_request:
    branches: [ master, source_from_vs ]
  workflow_dispatch:

jobs:
  build-arm64-glibc228:
    name: Build ARM64 (glibc 2.28 / AlmaLinux 8)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build in AlmaLinux 8 container (glibc 2.28)
        run: |
          chmod +x scripts/build_arm64.sh
          docker run --rm -v "$PWD":/workspace -w /workspace almalinux:8 bash /workspace/scripts/build_arm64.sh

      - name: Verify build artifact, dependencies, and symbols
        run: |
          echo "=== Artifact files ==="
          ls -la dist/lib/
          ls -la dist/include/hdfs/
          file dist/lib/libhdfs3.so

          echo "=== Direct DT_NEEDED dependencies (readelf) ==="
          readelf -d dist/lib/libhdfs3.so | grep NEEDED

          echo "=== Referenced GLIBC versions in libhdfs3.so ==="
          objdump -T dist/lib/libhdfs3.so | grep -o 'GLIBC_[0-9.]*' | sort -uV

          echo "=== Exported C symbols ==="
          objdump -T dist/lib/libhdfs3.so | grep " g " | grep -E "hdfsConnect|hdfsOpenFile|hdfsRead|hdfsPread|hdfsReleaseMemory"

          echo "=== Exported Protobuf symbols ==="
          objdump -T dist/lib/libhdfs3.so | grep " g " | grep "google.*protobuf" | head -n 20

          echo "=== Exported GSasl symbols ==="
          objdump -T dist/lib/libhdfs3.so | grep " g " | grep "gsasl_" | head -n 20

          echo "=== Exported LibXml2 symbols ==="
          objdump -T dist/lib/libhdfs3.so | grep " g " | grep "xml" | head -n 20

      - name: Upload ARM64 glibc-2.28 libhdfs3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs3-linux-arm64-glibc2.28
          path: |
            dist/lib/libhdfs3.so
            dist/lib/libhdfs3.a
            dist/include/
          if-no-files-found: error
